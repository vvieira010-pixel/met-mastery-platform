                  - paragraph [ref=f2e66]: Learn
                  - heading "Stitch via MCP" [level=1] [ref=f2e67]
                  - paragraph [ref=f2e68]: Connect IDEs and CLIs to Stitch using the Model Context Protocol.
                - generic [ref=f2e70]:
                  - generic [ref=f2e71]:
                    - paragraph [ref=f2e72]: The Stitch Model Context Protocol (MCP) server allows your favorite AI tools like Cursor, Antigravity, or the Gemini CLI to directly interact with your Stitch projects.
                    - generic [ref=f2e73]:
                      - heading "Understanding Remote MCP" [level=2] [ref=f2e74]
                      - link "Section titled “Understanding Remote MCP”" [ref=f2e75] [cursor=pointer]:
                        - /url: "#understanding-remote-mcp"
                    - paragraph [ref=f2e80]:
                      - text: Most MCP servers you use are
                      - strong [ref=f2e81]: Local
                      - text: . They read files on your hard drive or run scripts on your machine. Stitch is a
                      - strong [ref=f2e82]: Remote
                      - text: MCP server. It lives in the cloud.
                    - paragraph [ref=f2e83]: Because it is remote, it requires a secure “handshake” to ensure that the AI agent acting on your behalf actually has permission to modify your designs.
                    - generic [ref=f2e84]:
                      - heading "API Keys vs OAuth" [level=2] [ref=f2e85]
                      - link "Section titled “API Keys vs OAuth”" [ref=f2e86] [cursor=pointer]:
                        - /url: "#api-keys-vs-oauth"
                    - paragraph [ref=f2e91]: "The Stitch MCP server supports two authentication methods:"
                    - list [ref=f2e92]:
                      - listitem [ref=f2e93]:
                        - strong [ref=f2e94]: "API Keys:"
                        - text: Persistent keys generated in the
                        - link "Stitch Settings page" [ref=f2e95] [cursor=pointer]:
                          - /url: /settings
                        - text: .
                      - listitem [ref=f2e96]:
                        - strong [ref=f2e97]: "OAuth:"
                        - text: A browser-based authentication flow required by specific AI clients that do not support manual key entry, or for environments where storing persistent secrets on disk is restricted.
                    - generic [ref=f2e98]:
                      - heading "When to use which" [level=3] [ref=f2e99]
                      - link "Section titled “When to use which”" [ref=f2e100] [cursor=pointer]:
                        - /url: "#when-to-use-which"
                    - paragraph [ref=f2e105]: In most cases, API Keys are the easiest approach. They are the fastest way to get your tool connected. However, OAuth is worth the extra minute of setup in specific situations.
                    - table [ref=f2e106]:
                      - rowgroup [ref=f2e107]:
                        - row [ref=f2e108]:
                          - columnheader "Scenario" [ref=f2e109]
                          - columnheader [ref=f2e110]:
                            - text: Use
                            - strong [ref=f2e111]: API Keys
                            - text: if…
                          - columnheader [ref=f2e112]:
                            - text: Use
                            - strong [ref=f2e113]: OAuth
                            - text: if…
                      - rowgroup [ref=f2e114]:
                        - row [ref=f2e115]:
                          - cell [ref=f2e116]:
                            - strong [ref=f2e117]: Client Support
                          - cell "Your tool (e.g., Cursor, Antigravity, or the Gemini CLI) accepts an API key in a config file or environment variable." [ref=f2e118]
                          - cell "Your tool (e.g., web-based tools) requires a “Sign In” flow and doesn’t provide a way to manually input a key." [ref=f2e119]
                        - row [ref=f2e120]:
                          - cell [ref=f2e121]:
                            - strong [ref=f2e122]: Storage Policy
                          - cell [ref=f2e123]:
                            - text: You are on a private machine where saving a secret key in a local
                            - code [ref=f2e124]: .json
                            - text: or
                            - code [ref=f2e125]: .env
                            - text: file is standard practice.
                          - cell "You are in a “Zero-Trust” or ephemeral environment where saving persistent secrets to the hard drive is blocked or risky." [ref=f2e126]
                        - row [ref=f2e127]:
                          - cell [ref=f2e128]:
                            - strong [ref=f2e129]: Revocation
                          - cell [ref=f2e130]:
                            - text: You are comfortable manually deleting a key from the
                            - link "Stitch Settings page" [ref=f2e131] [cursor=pointer]:
                              - /url: /settings
                            - text: and then finding/removing it from your local files.
                          - cell [ref=f2e132]:
                            - text: You want the ability to “Log Out” and instantly invalidate the tool’s access via the
                            - link "Stitch Settings page" [ref=f2e133] [cursor=pointer]:
                              - /url: /settings
                            - text: without hunting for local files.
                        - row [ref=f2e134]:
                          - cell [ref=f2e135]:
                            - strong [ref=f2e136]: Session Logic
                          - cell "You want a connection that stays active indefinitely until you manually change it." [ref=f2e137]
                          - cell "You prefer a session-based connection that can be set to expire or require a re-approval after a period of inactivity." [ref=f2e138]
                    - generic [ref=f2e139]:
                      - heading "API Key Setup" [level=2] [ref=f2e140]
                      - link "Section titled “API Key Setup”" [ref=f2e141] [cursor=pointer]:
                        - /url: "#api-key-setup"
