      - generic [ref=e789]:
        - heading "Frequently Asked Questions" [level=2] [ref=e791]
        - generic [ref=e792]:
          - generic [ref=e793]:
            - heading "What is SurveyHeart?" [level=2] [ref=e794]
            - paragraph [ref=e795]: SurveyHeart is a free online form builder, survey maker and poll creator. You can create registration forms, feedback forms, attendance forms, contact forms, order forms, quizzes and more without coding. Share them by link, QR code, WhatsApp, email or embed.
          - generic [ref=e796]:
            - heading "Is SurveyHeart free?" [level=2] [ref=e797]
            - paragraph [ref=e798]: Yes. SurveyHeart lets you create forms, surveys and polls for free. You can build forms, share them and collect responses without a time limit. Advanced features may be available on paid plans.
          - generic [ref=e799]:
            - heading "Are responses unlimited on the free plan?" [level=2] [ref=e800]
            - paragraph [ref=e801]: SurveyHeart does not apply a standard hard response cap for normal form usage. You can create and share forms freely, while unusually high-volume accounts may be reviewed under fair-use policies.
          - generic [ref=e802]:
            - heading "Can I create forms from my phone?" [level=2] [ref=e803]
            - paragraph [ref=e804]: Yes. SurveyHeart has mobile apps for Android and iOS. You can create, edit, share and manage forms directly from your phone.
          - generic [ref=e805]:
            - heading "Do respondents need an account to fill my form?" [level=2] [ref=e806]
            - paragraph [ref=e807]: No. People can open your form link and submit their responses without creating a SurveyHeart account or signing in.
          - generic [ref=e808]:
            - heading "Can I share my form through WhatsApp or QR code?" [level=2] [ref=e809]
            - paragraph [ref=e810]: Yes. SurveyHeart supports sharing through WhatsApp, QR code, direct links, email and website embeds. This makes it easy to collect responses from groups, customers, students, employees and event attendees.
          - generic [ref=e811]:
            - heading "Is SurveyHeart a good Google Forms alternative?" [level=2] [ref=e812]
            - paragraph [ref=e813]: SurveyHeart is a useful Google Forms alternative for people who want to create forms from a mobile app, share through WhatsApp or QR code, and manage responses from web or mobile.
          - generic [ref=e814]:
            - heading "Can I create surveys with SurveyHeart?" [level=2] [ref=e815]
            - paragraph [ref=e816]: Yes. Create multi-question surveys with multiple choice, rating scales, open text answers, file uploads and more. You can view response charts, search submissions and export results for analysis.
          - generic [ref=e817]:
            - heading "Can I create quizzes with SurveyHeart?" [level=2] [ref=e818]
            - paragraph [ref=e819]: Yes. You can create quizzes with correct answers and scoring. The quiz experience, leaderboard and result pages are powered by Quizzory, SurveyHeart's quiz-focused sister product.
          - generic [ref=e820]:
            - heading "Can I export form responses?" [level=2] [ref=e821]
            - paragraph [ref=e822]: Yes. You can export form responses to CSV, Excel and PDF from the responses section. This makes it easy to analyse data, create reports or share results with your team.
