name: Scoring Branch Validation

on:
  push:
    branches:
      - fix/scoring-diagnosis-reliability
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Practice Studio contract tests
        run: node --test tests/practice-studio-contract.test.js tests/practice-studio-submission.test.js
      - name: Writing scoring tests
        run: node --test tests/met-writing-scoring.test.js
      - name: Lint changed scoring files
        run: npx eslint src/components/exercises/ExercisePlayer.jsx src/components/exercises/ShortAnswer.jsx src/components/exercises/Writing.jsx src/lib/writing-score.js api/_routes/evaluate-writing.js --max-warnings 0
      - name: Build
        run: npm run build
