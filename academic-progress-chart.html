<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MET Mastery — Academic Progress</title>

  <!-- Chart.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    /* ---- MET Mastery design tokens (mirrors DESIGN.md) ---- */
    :root {
      --page: #FDFCF8;
      --card-bg: #FFFFFF;
      --card-radius: 16px;
      --card-padding: 22px;
      --ink: #1A2E35;
      --ink-soft: #67777B;
      --hairline: #E8E5DF;
      --shadow-card: 0 1px 4px rgba(26, 46, 53, 0.04);
      --shadow-float: 0 18px 45px rgba(26, 46, 53, 0.08);

      /* Brand section-coding (matches MetProgressPathGraph.jsx) */
      --reading: #2D7A8C;    /* teal */
      --listening: #3D8C65;  /* green */
      --speaking: #E08E45;   /* amber */
    }

    [data-theme="dark"] {
      --page: #0F1B2D;
      --card-bg: #16263a;
      --ink: #F4F7F8;
      --ink-soft: #9FB0B6;
      --hairline: rgba(255, 255, 255, 0.12);
      --shadow-card: 0 1px 4px rgba(0, 0, 0, 0.3);
      --shadow-float: 0 18px 45px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px;
      background: var(--page);
      font-family: "DM Sans", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .dashboard {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    /* ---- The "Academic Progress" widget card ---- */
    .card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      padding: var(--card-padding);
      box-shadow: var(--shadow-card), var(--shadow-float);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .card__head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .card__title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin: 0;
    }

    .card__sub {
      font-size: 0.78rem;
      color: var(--ink-soft);
      margin: 2px 0 16px;
    }

    /* ---- Chart canvas wrapper: responsive + preserves card padding ---- */
    .chart-wrap {
      position: relative;
      width: 100%;
      height: clamp(220px, 34vw, 320px); /* scales with viewport, capped for large screens */
    }

    /* ---- Minimalist legend (brand section-coding) ---- */
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--hairline);
    }

    .legend__item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    .legend__dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    /* ---- Small-screen tightening ---- */
    @media (max-width: 420px) {
      body { padding: 16px; }
      .card { padding: 16px; }
      .chart-wrap { height: 240px; }
    }
  </style>
</head>
<body>
  <div class="dashboard">

    <!-- ============================================================
         ACADEMIC PROGRESS WIDGET
         ============================================================ -->
    <section class="card" aria-label="Academic Progress">
      <div class="card__head">
        <h2 class="card__title">Academic Progress</h2>
      </div>
      <p class="card__sub">Daily percentage scores · Monday – Sunday</p>

      <!-- Chart canvas (scales responsively inside the card) -->
      <div class="chart-wrap">
        <canvas id="academicProgressChart"></canvas>
      </div>

      <!-- Minimalist legend (brand section-coding) -->
      <div class="legend">
        <span class="legend__item"><span class="legend__dot" style="background:var(--reading)"></span>Reading</span>
        <span class="legend__item"><span class="legend__dot" style="background:var(--listening)"></span>Listening</span>
        <span class="legend__item"><span class="legend__dot" style="background:var(--speaking)"></span>Speaking</span>
      </div>
    </section>

  </div>

  <script>
    (function () {
      const labels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];

      const cssVar = (name, fallback) => {
        const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        return v || fallback;
      };

      const data = {
        labels,
        datasets: [
          {
            label: "Reading",
            data: [72, 78, 75, 82, 80, 85, 88],
            borderColor: cssVar("--reading", "#2D7A8C"),
            backgroundColor: "rgba(45, 122, 140, 0.10)",
            pointBackgroundColor: cssVar("--reading", "#2D7A8C"),
            pointBorderColor: "#ffffff",
            pointRadius: 3,
            pointHoverRadius: 5,
            borderWidth: 2.5,
            tension: 0.35,
            fill: true
          },
          {
            label: "Listening",
            data: [65, 70, 68, 72, 75, 73, 79],
            borderColor: cssVar("--listening", "#3D8C65"),
            backgroundColor: "rgba(61, 140, 101, 0.10)",
            pointBackgroundColor: cssVar("--listening", "#3D8C65"),
            pointBorderColor: "#ffffff",
            pointRadius: 3,
            pointHoverRadius: 5,
            borderWidth: 2.5,
            tension: 0.35,
            fill: true
          },
          {
            label: "Speaking",
            data: [58, 62, 67, 64, 70, 74, 76],
            borderColor: cssVar("--speaking", "#E08E45"),
            backgroundColor: "rgba(224, 142, 69, 0.10)",
            pointBackgroundColor: cssVar("--speaking", "#E08E45"),
            pointBorderColor: "#ffffff",
            pointRadius: 3,
            pointHoverRadius: 5,
            borderWidth: 2.5,
            tension: 0.35,
            fill: true
          }
        ]
      };

      const config = {
        type: "line",
        data,
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: cssVar("--ink", "#1A2E35"),
              titleColor: cssVar("--on-dark", "#FFFFFF"),
              bodyColor: cssVar("--on-dark", "#FFFFFF"),
              padding: 10,
              cornerRadius: 8,
              displayColors: true,
              callbacks: {
                label: function (ctx) {
                  return ctx.dataset.label + ": " + ctx.parsed.y + "%";
                }
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              border: { display: false },
              ticks: { color: cssVar("--ink-soft", "#67777B"), font: { size: 12 } }
            },
            y: {
              min: 0,
              max: 100,
              grid: { display: false },
              border: { display: false },
              ticks: {
                color: cssVar("--ink-soft", "#67777B"),
                font: { size: 12 },
                stepSize: 20,
                callback: function (value) { return value + "%"; }
              }
            }
          }
        }
      };

      const chart = new Chart(document.getElementById("academicProgressChart"), config);

      // Recolour axis/tooltip text when the theme flips.
      const observer = new MutationObserver(() => {
        const tick = cssVar("--ink-soft", "#67777B");
        chart.options.scales.x.ticks.color = tick;
        chart.options.scales.y.ticks.color = tick;
        chart.options.plugins.tooltip.backgroundColor = cssVar("--ink", "#1A2E35");
        chart.options.plugins.tooltip.titleColor = cssVar("--on-dark", "#FFFFFF");
        chart.options.plugins.tooltip.bodyColor = cssVar("--on-dark", "#FFFFFF");
        chart.update("none");
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });
    })();
  </script>
</body>
</html>
